[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "integration-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["."]
markers = [
    "slow: marks tests as slow (LLM calls)",
]
