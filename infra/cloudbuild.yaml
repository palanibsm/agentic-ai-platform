# Cloud Build CI/CD pipeline for Agentic AI Platform
# Triggered on push to main branch.
# Flow: build images in parallel -> deploy services in dependency order.

substitutions:
  _REGION: us-central1
  _PROJECT: ai-agent-project-497604
  _REGISTRY: us-central1-docker.pkg.dev/ai-agent-project-497604/agentic-ai
  _IMAGE_TAG: $COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:

  # ── Phase 1: Build all images in parallel ──────────────────────────────────

  - id: build-governance
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGISTRY/governance:$_IMAGE_TAG
      - -t
      - $_REGISTRY/governance:latest
      - services/governance
    waitFor: ["-"]

  - id: build-llm-gateway
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGISTRY/llm-gateway:$_IMAGE_TAG
      - -t
      - $_REGISTRY/llm-gateway:latest
      - services/llm-gateway
    waitFor: ["-"]

  - id: build-rag-service
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGISTRY/rag-service:$_IMAGE_TAG
      - -t
      - $_REGISTRY/rag-service:latest
      - services/rag-service
    waitFor: ["-"]

  - id: build-agent-core
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGISTRY/agent-core:$_IMAGE_TAG
      - -t
      - $_REGISTRY/agent-core:latest
      - services/agent-core
    waitFor: ["-"]

  # ── Phase 2: Push all images ───────────────────────────────────────────────

  - id: push-governance
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/governance]
    waitFor: [build-governance]

  - id: push-llm-gateway
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/llm-gateway]
    waitFor: [build-llm-gateway]

  - id: push-rag-service
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/rag-service]
    waitFor: [build-rag-service]

  - id: push-agent-core
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/agent-core]
    waitFor: [build-agent-core]

  # ── Phase 3: Deploy in dependency order ───────────────────────────────────

  - id: deploy-governance
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - governance
      - --image=$_REGISTRY/governance:$_IMAGE_TAG
      - --region=$_REGION
      - --project=$_PROJECT
      - --quiet
    waitFor: [push-governance]

  - id: deploy-llm-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - llm-gateway
      - --image=$_REGISTRY/llm-gateway:$_IMAGE_TAG
      - --region=$_REGION
      - --project=$_PROJECT
      - --quiet
    waitFor: [push-llm-gateway]

  - id: deploy-rag-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-service
      - --image=$_REGISTRY/rag-service:$_IMAGE_TAG
      - --region=$_REGION
      - --project=$_PROJECT
      - --quiet
    waitFor: [push-rag-service]

  - id: deploy-agent-core
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agent-core
      - --image=$_REGISTRY/agent-core:$_IMAGE_TAG
      - --region=$_REGION
      - --project=$_PROJECT
      - --quiet
    waitFor:
      - push-agent-core
      - deploy-governance
      - deploy-llm-gateway
      - deploy-rag-service

  # ── Phase 4: Build portal + ide-chat with agent-core URL baked in ───────────

  - id: get-agent-core-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        url=$(gcloud run services describe agent-core \
          --region=$_REGION --project=$_PROJECT \
          --format="value(status.url)")
        echo "$url" > /workspace/agent_core_url.txt
        echo "agent-core URL: $url"
    waitFor: [deploy-agent-core]

  - id: build-portal
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        AGENT_URL=$(cat /workspace/agent_core_url.txt)
        docker build \
          --build-arg NEXT_PUBLIC_AGENT_URL="$AGENT_URL" \
          -t $_REGISTRY/portal:$_IMAGE_TAG \
          -t $_REGISTRY/portal:latest \
          apps/portal
    waitFor: [get-agent-core-url]

  - id: build-ide-chat
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        AGENT_URL=$(cat /workspace/agent_core_url.txt)
        docker build \
          --build-arg NEXT_PUBLIC_AGENT_URL="$AGENT_URL" \
          -t $_REGISTRY/ide-chat:$_IMAGE_TAG \
          -t $_REGISTRY/ide-chat:latest \
          apps/ide-chat
    waitFor: [get-agent-core-url]

  - id: push-portal
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/portal]
    waitFor: [build-portal]

  - id: push-ide-chat
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, $_REGISTRY/ide-chat]
    waitFor: [build-ide-chat]

  - id: deploy-portal
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        AGENT_URL=$(cat /workspace/agent_core_url.txt)
        gcloud run deploy portal \
          --image=$_REGISTRY/portal:$_IMAGE_TAG \
          --region=$_REGION \
          --project=$_PROJECT \
          --update-env-vars="AGENT_CORE_URL=$AGENT_URL,NEXT_PUBLIC_AGENT_URL=$AGENT_URL" \
          --quiet
    waitFor: [push-portal]

  - id: deploy-ide-chat
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        AGENT_URL=$(cat /workspace/agent_core_url.txt)
        gcloud run deploy ide-chat \
          --image=$_REGISTRY/ide-chat:$_IMAGE_TAG \
          --region=$_REGION \
          --project=$_PROJECT \
          --update-env-vars="AGENT_CORE_URL=$AGENT_URL,NEXT_PUBLIC_AGENT_URL=$AGENT_URL" \
          --quiet
    waitFor: [push-ide-chat]

images:
  - $_REGISTRY/governance:$_IMAGE_TAG
  - $_REGISTRY/llm-gateway:$_IMAGE_TAG
  - $_REGISTRY/rag-service:$_IMAGE_TAG
  - $_REGISTRY/agent-core:$_IMAGE_TAG
  - $_REGISTRY/portal:$_IMAGE_TAG
  - $_REGISTRY/ide-chat:$_IMAGE_TAG
