name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent-core, rag-service, governance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - run: ruff check services/${{ matrix.service }}/src
      - run: pytest services/${{ matrix.service }}/tests --tb=short || true

  lint-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [portal, ide-chat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd apps/${{ matrix.app }} && npm install && npm run build

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: cd infra/terraform && terraform init -backend=false && terraform validate

  integration-tests:
    runs-on: ubuntu-latest
    # Only run on main branch pushes — not on PRs (requires live Cloud Run services)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest httpx pytest-timeout
      - name: Run integration tests
        working-directory: tests/integration
        env:
          AGENT_CORE_URL:  ${{ secrets.AGENT_CORE_URL }}
          RAG_SERVICE_URL: ${{ secrets.RAG_SERVICE_URL }}
          GOVERNANCE_URL:  ${{ secrets.GOVERNANCE_URL }}
          TEST_TIMEOUT:    "120"
        run: pytest . --tb=short -v --timeout=120
