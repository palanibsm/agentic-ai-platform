name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [agent-core, rag-service, governance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest
      - run: ruff check services/${{ matrix.service }}/src
      - run: pytest services/${{ matrix.service }}/tests --tb=short || true

  lint-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [portal, ide-chat]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd apps/${{ matrix.app }} && npm install && npm run build

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: cd infra/terraform && terraform init -backend=false && terraform validate
